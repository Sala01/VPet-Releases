name: Announce release on Discord

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to announce (for example v0.3.16)
        required: true

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Post the release to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json name,body,url > release.json
          jq -n --slurpfile r release.json '{
            username: "VPet releases",
            embeds: [{
              title: ("New release: " + ($r[0].name // $r[0].url)),
              url: $r[0].url,
              description: (($r[0].body // "") + "\n\nDownload: " + $r[0].url),
              color: 5763719
            }]
          }' > payload.json
          curl -sS --fail -H "Content-Type: application/json" -d @payload.json "$WEBHOOK"
